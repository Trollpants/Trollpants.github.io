<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <meta name="description" content="Interstellar Drift | WebGL">
    <meta name="author" content="Jan Ivar Z. Carlsen">

    <title>Interstellar Drift | WebGL</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../css/bootstrap.min.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab" rel="stylesheet" type="text/css">

    <!-- Stylesheets -->
    <link href="../css/main.css" rel="stylesheet">
    <link href="InterstellarDrift/TemplateData/style.css" rel="stylesheet">

    <!-- Fav Icon -->
    <link rel="shortcut icon" href="../img/InterstellarDriftIcon.png">

</head>

<body>

    <div class="wrapper" style="margin: 0 auto; width: 1600px; position: relative;">
        <h2 class="display-5 py-3" style="margin-top: 30px; margin-bottom: 0px">Interstellar Drift</h2>
        <div id="unity-container" style="width: 1600px; height: 900px; position: relative;">
            <canvas id="unity-canvas" width="1600" height="900" tabindex="-1" style="width: 1600px; height: 900px;"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <div id="unity-warning"> </div>
            <div id="unity-footer">
                <div id="unity-fullscreen-button"></div>
            </div>
        </div>
        <h4 style="margin-top: 10px; margin-bottom: 0px">Controls</h4>
        <p>Mouse for menus. A and D or left and right arrow keys to turn. Space to boost.</p>
    </div>

    <footer>
        <div class="container page-footer">
            <div class="row">
                <p class="copyright text-muted small" style="margin-left: auto; margin-right: auto">Copyright &copy; Jan Ivar Z. Carlsen 2026. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "InterstellarDrift/Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.br",
        frameworkUrl: buildUrl + "/Web.framework.js.br",
        codeUrl: buildUrl + "/Web.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Trollpants Game Studio",
        productName: "Interstellar Drift",
        productVersion: "1.3",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>

</body>

</html>
